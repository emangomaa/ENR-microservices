services:
  postgres:
    image: postgres:17
    container_name: enr-postgres
    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: enr-password

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
  

  rabbitmq:
    image: rabbitmq:4-management
    container_name: enr-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: enr-username
      RABBITMQ_DEFAULT_PASS: enr-password

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq


  redis:
    image: redis:7-alpine

    container_name: enr-redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes


volumes:
  postgres_data:
  rabbitmq_data:
  redis_data: